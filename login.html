<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - Smart Circular Economy Marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-body">
  
  <div class="login-container">
    <div class="login-visual">
      <div class="visual-content">
        <div class="brand">
          <iconify-icon icon="ph:recycle-bold"></iconify-icon>
          <span>SCEM</span>
        </div>
        <h2>Reduce Waste.<br>Reuse Smartly.</h2>
        <p>Join the AI-powered circular economy marketplace and build a zero-waste future today.</p>
        <div class="visual-footer">
          <div class="stat-pill">
            <iconify-icon icon="ph:users-bold"></iconify-icon>
            <span>10k+ Users</span>
          </div>
          <div class="stat-pill">
            <iconify-icon icon="ph:leaf-bold"></iconify-icon>
            <span>50k+ Items Saved</span>
          </div>
        </div>
      </div>
      <div class="visual-overlay"></div>
    </div>

    <div class="login-form-wrapper">
      <div class="login-form-card">
        <div class="form-header">
          <h3>Welcome Back</h3>
          <p>Please enter your details to sign in.</p>
        </div>

        <form id="loginForm" onsubmit="event.preventDefault(); window.location.href='/login';">
          <div class="form-group">
            <label for="email">Email Address</label>
            <div class="input-icon-wrapper">
              <iconify-icon icon="ph:envelope-simple-bold"></iconify-icon>
              <input type="email" id="email" placeholder="you@example.com" required />
            </div>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-icon-wrapper">
              <iconify-icon icon="ph:lock-key-bold"></iconify-icon>
              <input type="password" id="password" placeholder="••••••••" required />
            </div>
          </div>

          <div class="form-row">
            <label class="checkbox-label">
              <input type="checkbox" checked />
              <span>Remember me</span>
            </label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>

          <button type="submit" class="btn-primary btn-login">
            <span>Sign In</span>
            <iconify-icon icon="ph:arrow-right-bold"></iconify-icon>
          </button>

          <button type="button" class="btn-google">
            <iconify-icon icon="logos:google-icon"></iconify-icon>
            <span>Sign in with Google</span>
          </button>

          <p class="signup-link">
            Don't have an account? <a href="#">Create free account</a>
          </p>
        </form>
      </div>
    </div>
  </div>

</body>
</html>
